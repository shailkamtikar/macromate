[project]
name = "macromate-backend"
version = "0.1.0"
description = "MacroMate FastAPI backend — macro calculations, food suggestions, chatbot orchestration, notifications, weekly reports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "pyjwt[crypto]>=2.13.0",
    "cachetools>=7.1.8",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.2",
]
